name: Nox release

on:
  push:
    branches: [nox]
  workflow_dispatch:
    inputs:
      operation:
        description: Build a candidate, or promote this revision after acceptance review
        type: choice
        options: [build, promote]
        default: build
        required: true

permissions:
  contents: write
  packages: write

concurrency:
  group: nox-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == '76616c6172/AgentsInTheCloud' && github.ref == 'refs/heads/nox'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_PACKAGE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      # The image build compiles the workspace helper and gateway with local Go.
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/workspace-helper/helper/go.mod
          cache-dependency-path: packages/*/helper/go.sum
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test packages/shared/test packages/update/test packages/vscode/test images/system/src/channel-update.test.ts scripts/nox-release.test.ts
      - run: bun test scripts/nox-upstream.test.ts packages/nox-workspace
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Free runner space for the workspace and runtime images
        if: inputs.operation != 'promote'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - name: Build immutable candidate images
        if: inputs.operation != 'promote'
        run: bun scripts/nox-release.ts build
      - name: Promote the reviewed candidate (no rebuild)
        if: inputs.operation == 'promote'
        run: bun scripts/nox-release.ts promote
